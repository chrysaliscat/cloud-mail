name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloudmail"
database_id = "2f95a97c-3be5-45f6-89d9-b6796d3214ab"

[[kv_namespaces]]
binding = "kv"
id = "60a3f7b814cf435688add1c47b9b8103"

[[r2_buckets]]
binding = "r2"
bucket_name = "email"

[[send_email]]
name = "forward"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
admin = "admin@chrysaliscat.dpdns.org"
domain = ["chrysaliscat.dpdns.org"]
jwt_secret = "hellohellohello"
ai_model = "@cf/meta/llama-3.1-8b-instruct-fast"
analysis_cache = false
orm_log = false

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
